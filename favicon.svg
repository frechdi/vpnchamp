<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield background -->
  <path d="M 50 10 L 85 25 L 85 50 Q 85 75 50 90 Q 15 75 15 50 L 15 25 Z"
        fill="url(#shieldGrad)"
        stroke="#1e293b"
        stroke-width="1.5"/>

  <!-- Lock icon inside shield -->
  <g transform="translate(50, 50)">
    <!-- Lock body -->
    <rect x="-12" y="-5" width="24" height="20" rx="4"
          fill="none"
          stroke="#1e293b"
          stroke-width="2"/>

    <!-- Lock shackle (top semicircle) -->
    <path d="M -8 -5 Q -8 -18 0 -18 Q 8 -18 8 -5"
          fill="none"
          stroke="#1e293b"
          stroke-width="2.5"
          stroke-linecap="round"/>

    <!-- Lock keyhole center dot -->
    <circle cx="0" cy="4" r="2" fill="#1e293b"/>
  </g>
</svg>
